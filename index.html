<template id="activity-template">
      <article class="activity-card">
        <button type="button" class="activity-card__header">
          <span class="activity-number"></span>
          <span class="activity-title">
            <strong class="activity-summary">Novo problema</strong>
            <small class="activity-meta">Sem informações</small>
          </span>
          <span class="activity-status is-empty">Pendente</span>
          <span class="chevron">⌄</span>
        </button>

        <div class="activity-card__body">
          <div class="form-grid activity-fields">
            <label>
              <span>Data de entrada</span>
              <input type="date" data-field="dataAntes" />
            </label>
            <label>
              <span>Data de saída</span>
              <input type="date" data-field="dataDepois" />
            </label>
            <label>
              <span>Nº da OS da ocorrência</span>
              <input data-field="ordemServico" placeholder="Ex.: OS-001234" />
            </label>
            <label>
              <span>Responsável técnico</span>
              <input data-field="responsavel" placeholder="Nome do responsável técnico" />
            </label>
            <label class="form-grid__wide">
              <span>Problema / descrição do serviço</span>
              <textarea
                data-field="atividade"
                rows="3"
                placeholder="Ex.: Consertar caixa d'água com vazamento"
              ></textarea>
            </label>
          </div>

          <!-- BLOCO DE FOTOS E LEGENDAS EXATAMENTE COMO O APP.JS ESPERA -->
          <div class="photo-grid">
            <p class="photo-row-title is-entry">Antes do serviço</p>
            
            <div class="photo-slot">
              <label class="photo-input is-entry">
                <span class="photo-input__label">Foto antes 1</span>
                <input type="file" accept="image/*" data-field="fotoAntes" />
                <span class="photo-input__action">Selecionar imagem</span>
                <img alt="Prévia da foto antes 1" />
              </label>
              <label class="photo-caption">
                <span>Descrição da foto antes 1</span>
                <textarea data-field="legendaAntes" rows="2" maxlength="300" placeholder="Ex.: Vazamento na conexão de saída"></textarea>
              </label>
            </div>

            <div class="photo-slot">
              <label class="photo-input is-entry">
                <span class="photo-input__label">Foto antes 2</span>
                <input type="file" accept="image/*" data-field="fotoAntes2" />
                <span class="photo-input__action">Selecionar imagem</span>
                <img alt="Prévia da foto antes 2" />
              </label>
              <label class="photo-caption">
                <span>Descrição da foto antes 2</span>
                <textarea data-field="legendaAntes2" rows="2" maxlength="300" placeholder="Ex.: Outro ângulo do problema"></textarea>
              </label>
            </div>

            <p class="photo-row-title is-exit">Depois do serviço</p>

            <div class="photo-slot">
              <label class="photo-input is-exit">
                <span class="photo-input__label">Foto depois 1</span>
                <input type="file" accept="image/*" data-field="fotoDepois" />
                <span class="photo-input__action">Selecionar imagem</span>
                <img alt="Prévia da foto depois 1" />
              </label>
              <label class="photo-caption">
                <span>Descrição da foto depois 1</span>
                <textarea data-field="legendaDepois" rows="2" maxlength="300" placeholder="Ex.: Conexão substituída e vedada"></textarea>
              </label>
            </div>

            <div class="photo-slot">
              <label class="photo-input is-exit">
                <span class="photo-input__label">Foto depois 2</span>
                <input type="file" accept="image/*" data-field="fotoDepois2" />
                <span class="photo-input__action">Selecionar imagem</span>
                <img alt="Prévia da foto depois 2" />
              </label>
              <label class="photo-caption">
                <span>Descrição da foto depois 2</span>
                <textarea data-field="legendaDepois2" rows="2" maxlength="300" placeholder="Ex.: Outro ângulo do serviço concluído"></textarea>
              </label>
            </div>
          </div>

          <div class="activity-control">
            <div>
              <span class="field-label">Situação da atividade</span>
              <div class="status-control" role="group" aria-label="Situação da atividade">
                <button type="button" class="status-option is-active" data-status="concluida">Concluída</button>
                <button type="button" class="status-option" data-status="em-espera">Em espera</button>
              </div>
              <input type="hidden" data-field="status" value="concluida" />
            </div>

            <label class="waiting-reason-field" hidden>
              <span>Motivo da espera</span>
              <textarea data-field="motivo" rows="2" placeholder="Explique o que falta para concluir este serviço"></textarea>
            </label>

            <div class="occurrence-save-panel">
              <span data-occurrence-save-status>Ocorrência ainda não salva individualmente.</span>
              <div>
                <button type="button" class="secondary-action" data-save-occurrence>Salvar ocorrência</button>
                <button type="button" class="secondary-action" data-export-occurrence>Exportar PDF</button>
                <button type="button" class="clear-activity">Limpar campos</button>
                <button type="button" class="remove-activity" data-remove-occurrence>Excluir ocorrência</button>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>
